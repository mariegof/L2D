program: scripts/train.py
method: random
metric:
  name: validation_weighted_sum
  goal: minimize
parameters:
  num_layers:
    values: [2, 3, 4]
  neighbor_pooling_type:
    values: ["sum", "average"]
  graph_pool_type:
    values: ["average", "sum"]
  hidden_dim:
    values: [64, 128, 256]
  num_mlp_layers_feature_extract:
    values: [1, 2, 3]
  num_mlp_layers_actor:
    values: [1, 2, 3]
  hidden_dim_actor:
    values: [16, 32, 64]
  num_mlp_layers_critic:
    values: [1, 2, 3]
  hidden_dim_critic:
    values: [16, 32, 64]
  lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-3
  decayflag:
    values: [true, false]
  decay_step_size:
    values: [100, 200, 500, 1000, 2000]
  decay_ratio:
    values: [0.8, 0.9, 0.95]
  gamma:
    values: [0.99, 0.999, 1.0]
  k_epochs:
    values: [1, 5, 10, 15]
  eps_clip:
    values: [0.1, 0.2, 0.3]
  vloss_coef:
    values: [0.5, 1.0, 2.0]
  ploss_coef:
    values: [1.0, 2.0, 4.0]
  entloss_coef:
    values: [0.01, 0.02, 0.05]