# configs/sweep_config.yaml
# Master configuration for Job Shop Scheduling sweeps

# Sweep parameters
sweep_type: model   # Options: environment, feature, model, reward
weight_type: uniform      # Options: uniform, variable
count: 20                 # Number of runs
workers: 20                # Number of parallel workers
max_updates: 100         # Number of training episodes
validate_every: 100  # Validate every 20 episodes
override_max_updates: false  # Whether to override max_updates in sweep file

# Project settings
project: jssp-weighted-sum
entity: null              # WandB entity (username) - set to null if not using