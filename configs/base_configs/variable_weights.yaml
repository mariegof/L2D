# configs/uniform_weights/base_config.yaml
# Base configuration for uniform weights JSSP experiments

# Environment parameters
n_j: 6                         # Number of jobs
n_m: 6                         # Number of machines
low: 1                         # Lower bound of task duration
high: 99                       # Upper bound of task duration
weight_low: 1                  # Lower bound of job weights 
weight_high: 10                # Upper bound of job weights
rewardscale: 0.0               # Reward scaling factor
init_quality_flag: false       # Flag for initial state quality
et_normalize_coef: 1000        # Normalizing coefficient for end times
wkr_normalize_coef: 100        # Normalizing coefficient for work remaining

# Training parameters
max_updates: 2000              # Number of training episodes
np_seed_train: 200             # Random seed for numpy during training
np_seed_validation: 200        # Random seed for numpy during validation
torch_seed: 600                # Random seed for PyTorch
num_envs: 8                    # Number of parallel environments
device: "cpu"                  # Device for training ("cpu" or "cuda")

# Neural network parameters
num_layers: 3                  # Number of GNN layers
neighbor_pooling_type: "sum"   # Neighbor pooling type
graph_pool_type: "average"     # Graph pooling type
input_dim: 3                   # Input dimension
hidden_dim: 128                # Hidden dimension
num_mlp_layers_feature_extract: 2  # Number of MLP layers for feature extraction
num_mlp_layers_actor: 2        # Number of MLP layers for actor
hidden_dim_actor: 32           # Hidden dimension for actor
num_mlp_layers_critic: 2       # Number of MLP layers for critic
hidden_dim_critic: 32          # Hidden dimension for critic

# PPO parameters
lr: 2.0e-5                     # Learning rate
decayflag: true                # Learning rate decay flag
decay_step_size: 200           # Learning rate decay step size
decay_ratio: 0.9               # Learning rate decay ratio
gamma: 1.0                     # Discount factor
k_epochs: 10                   # Number of PPO epochs
eps_clip: 0.1                  # PPO clipping parameter
vloss_coef: 1.0                # Value loss coefficient
ploss_coef: 2.0                # Policy loss coefficient
entloss_coef: 0.02             # Entropy loss coefficient

# Feature and reward parameters
feature_set:                   # Set of features to use
  - "LBs"                      # Lower bounds on operation end times
  - "finished_mark"            # Binary indicators of completed operations
  - "normalized_weights"       # Normalized job weights
reward_strategy: "default"     # Reward function to use

# Evaluation parameters
validate_every: 100            # Validate every N episodes
eval_instances: 100            # Number of evaluation instances
test_instances: 100            # Number of test instances

# Experiment parameters
experiment_name: "variable_jssp_base"  # Name of the experiment
weight_type: "variable"         # Explicitly state weight type